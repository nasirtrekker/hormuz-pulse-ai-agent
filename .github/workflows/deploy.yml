name: Deploy

# Runs only after CI succeeded on main, or manually. Keyless auth: no stored credentials.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy to Cloud Run
        env:
          SKIP_BOOTSTRAP: "true"
          PUBLIC_SERVICE: ${{ vars.PUBLIC_SERVICE || 'false' }}
        run: ./deploy.sh "$PROJECT" "${REGION:-europe-west2}"
      - name: Verify the new revision is serving
        run: |
          gcloud run services describe hormuz-pulse --project "$PROJECT" --region "${REGION:-europe-west2}" \
            --format='value(status.url,status.latestReadyRevisionName,status.conditions[0].status)'
