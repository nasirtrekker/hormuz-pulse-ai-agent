name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests and attack-corpus regression
        run: python -W ignore -m unittest discover -s tests
      - name: ADK guardrail eval (no model call, no cloud credentials)
        run: adk eval hormuz evals/guardrails.evalset.json --config_file_path evals/test_config.json
      - name: Container build inputs exist
        run: test -f Dockerfile && test -f requirements.txt && test -f app/static/index.html
      - name: Script syntax
        run: bash -n deploy.sh && bash -n scripts/setup_cicd.sh

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
